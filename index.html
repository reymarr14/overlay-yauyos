<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Overlay Campeonato Yauyos</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1420;--bg2:#1b2a45;--acc:#22c55e;--acct:#04210e;--txt:#fff;--bg-rgb:14,20,32;--bg2-rgb:27,42,69;--acc-rgb:34,197,94;--txt-rgb:255,255,255}
*{box-sizing:border-box;margin:0}
body{background:transparent;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:500;color:var(--txt);overflow:hidden}
#stage{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.22),rgba(0,0,0,.68));opacity:0;transition:opacity .6s}
#veil.on{opacity:1}
section{position:absolute;opacity:0;transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1);pointer-events:none}
section.on{opacity:1;transform:none!important}
img{object-fit:contain}
.ph{width:1em;height:1em;border-radius:50%;background:currentColor;opacity:.2}
.card,.col,.bug,#ticker,.ttl{background:linear-gradient(135deg,rgba(var(--bg2-rgb),.74),rgba(var(--bg-rgb),.7));-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);border:1px solid rgba(var(--txt-rgb),.16);box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(var(--txt-rgb),.14)}
.pl{width:290px;height:290px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#e4e9f0);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 6px rgba(255,255,255,.12),0 0 0 9px var(--c),0 0 70px -6px var(--c),0 18px 40px rgba(0,0,0,.4)}
.pl img{width:74%;height:74%}.pl .ph{width:56%;height:56%;background:#8a93a5;opacity:.45}
/* presentación */
#intro{left:200px;top:90px;width:1520px}
.card{position:relative;border-radius:32px;padding:50px 70px 52px;text-align:center}
.card::before,.col::before,.bug::before{content:"";position:absolute;left:14%;right:14%;top:-1px;height:3px;background:linear-gradient(90deg,transparent,var(--acc),transparent);box-shadow:0 0 22px var(--acc)}
.card header{display:flex;align-items:center;justify-content:center;gap:32px;text-align:left}
.card header img{height:130px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))}
.card header p{font-size:28px;letter-spacing:8px;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.card h1{font-size:56px;font-weight:600;letter-spacing:3px;text-transform:uppercase;line-height:1}
.vs{display:flex;align-items:center;justify-content:space-between;margin:38px 0 30px}
.tm{width:520px;display:flex;flex-direction:column;align-items:center;gap:24px}
.tm b{font-size:54px;font-weight:600;letter-spacing:3px;text-transform:uppercase;line-height:1.05}
.tm b::after{content:"";display:block;height:4px;margin:14px auto 0;width:70%;background:linear-gradient(90deg,transparent,var(--c),transparent);box-shadow:0 0 16px var(--c)}
.x{display:flex;flex-direction:column;align-items:center;gap:18px;font-size:46px;letter-spacing:10px;padding-left:10px}
.x i{width:2px;height:110px;background:linear-gradient(transparent,var(--acc),transparent)}
.meta{display:inline-flex;align-items:center;gap:28px;font-size:36px;letter-spacing:4px;text-transform:uppercase;padding:10px 44px;border-radius:999px;border:1px solid rgba(var(--acc-rgb),.7);background:rgba(var(--acc-rgb),.14)}
.meta span+span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:28px;vertical-align:middle;box-shadow:0 0 12px var(--acc)}
/* alineaciones */
#lineup{left:130px;top:46px;width:1660px}
.tw{text-align:center;margin-bottom:22px}
.ttl{display:inline-flex;align-items:center;gap:26px;font-size:34px;letter-spacing:6px;text-transform:uppercase;padding:10px 46px;border-radius:999px}
.ttl i{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:36px}
.col{position:relative;border-radius:28px;padding:28px 40px 30px}
.col::before{background:linear-gradient(90deg,transparent,var(--c),transparent);box-shadow:0 0 22px var(--c)}
.col ul{padding:0}
.col h2{height:112px;font-size:44px;line-height:1.05;position:relative;display:flex;align-items:center;gap:22px;font-weight:600;letter-spacing:3px;text-transform:uppercase;padding-bottom:16px;margin-bottom:10px;border-bottom:1px solid rgba(var(--txt-rgb),.18)}
.col h2::after{content:"";position:absolute;left:0;bottom:-1px;width:38%;height:3px;background:var(--c);box-shadow:0 0 14px var(--c)}
.col h2 .pl{width:84px;height:84px;box-shadow:0 0 0 3px var(--c),0 6px 16px rgba(0,0,0,.4)}
.col li{list-style:none;display:flex;align-items:center;gap:22px;font-size:42px;letter-spacing:1px;line-height:1.3;border-bottom:1px solid rgba(var(--txt-rgb),.1)}
.col li b{flex:none;width:52px;height:52px;border-radius:50%;border:1.5px solid rgba(var(--acc-rgb),.85);color:var(--acc);font-size:28px;font-weight:600;display:flex;align-items:center;justify-content:center;background:rgba(var(--acc-rgb),.1)}
.col.sm li{font-size:32px;line-height:1.2}.col.sm li b{width:42px;height:42px;font-size:22px}
/* marcador */
#match{left:56px;top:46px;transform:translateX(-50px)}
.bug{position:relative;display:flex;align-items:center;height:90px;border-radius:20px;padding:0 10px 0 8px}
.bug::before{left:18px;right:18px;height:2px}
.bug>*{display:flex;align-items:center}
.bug .cl{padding:0 14px 0 8px}.bug .cl img{height:66px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.bug .t{position:relative;gap:14px;padding:0 22px;height:100%;font-size:46px;font-weight:600;letter-spacing:3px;text-transform:uppercase}
.bug .t::after{content:"";position:absolute;left:22px;right:22px;bottom:9px;height:4px;border-radius:2px;background:var(--c);box-shadow:0 0 14px var(--c)}
.bug .t .pl{width:60px;height:60px;box-shadow:0 0 0 2px var(--c),0 4px 12px rgba(0,0,0,.4)}
.bug .sw{gap:14px;padding:0 20px;height:62px;border-radius:14px;background:rgba(var(--txt-rgb),.1);font-size:56px;font-weight:600;font-variant-numeric:tabular-nums}
.bug .sw i{width:2px;height:30px;background:rgba(var(--txt-rgb),.35)}
.bug .clk{margin-left:10px;height:62px;padding:0 22px;gap:12px;min-width:190px;justify-content:center;border-radius:14px;background:linear-gradient(135deg,var(--acc),rgba(var(--acc-rgb),.7));color:var(--acct);font-size:46px;font-weight:600;letter-spacing:1px;font-variant-numeric:tabular-nums}
.bug .clk em{font-style:normal;font-size:28px;letter-spacing:2px;opacity:.85}
/* cintillo y banner */
#ticker{position:absolute;left:56px;right:56px;bottom:30px;height:72px;display:flex;overflow:hidden;border-radius:18px;opacity:0;transform:translateY(24px);transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
#ticker.on{opacity:1;transform:none}
#ticker i{flex:none;font-style:normal;display:flex;align-items:center;padding:0 60px 0 32px;margin-right:-12px;font-size:34px;font-weight:600;letter-spacing:5px;text-transform:uppercase;background:linear-gradient(135deg,var(--acc),rgba(var(--acc-rgb),.75));color:var(--acct);clip-path:polygon(0 0,100% 0,calc(100% - 24px) 100%,0 100%)}
#ticker span{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center;font-size:40px;letter-spacing:1px;padding-left:12px}
.mq{flex:none;white-space:nowrap;padding-left:100%;animation:mq var(--d,20s) linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
#aus{position:absolute;bottom:30px;height:176px;max-width:1740px;overflow:hidden;background:rgba(255,255,255,.96);color:#14181f;display:flex;align-items:center;justify-content:center;padding:0 34px;font-size:60px;font-weight:600;letter-spacing:2px;border-radius:26px;box-shadow:0 18px 50px rgba(0,0,0,.45);opacity:0;transform:translateY(60px);transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
#aus::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,transparent,var(--acc),transparent)}
#aus.on{opacity:1;transform:none}
#aus.l{left:56px}#aus.r{right:56px}#aus.c{left:0;right:0;margin:0 auto;width:fit-content}
#aus img{height:148px;max-width:1660px;object-fit:contain;transition:opacity .3s}#aus img.sw{opacity:0}
/* animaciones de entrada */
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-120px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(120px)}to{opacity:1;transform:none}}
#intro.on .card{animation:up .8s cubic-bezier(.2,.8,.2,1) both}
#intro.on .pl{animation:pop .9s .25s cubic-bezier(.2,1.2,.3,1) both}
#intro.on .tm b,#intro.on .x,#intro.on .meta{animation:up .8s .45s both}
#lineup.on .tw{animation:up .7s both}
#lineup.on .col:nth-child(1){animation:inL .8s .1s cubic-bezier(.2,.8,.2,1) both}
#lineup.on .col:nth-child(2){animation:inR .8s .1s cubic-bezier(.2,.8,.2,1) both}
#lineup.on li{animation:up .5s calc(.35s + var(--i)*.05s) both}
/* panel de control */
#ctl{display:none;font:14px system-ui,sans-serif;color:#e8edf3;background:#1a2230;padding:10px;min-height:100vh}
body.control{background:#1a2230;overflow:auto}body.control #ctl{display:block}body.control #stage{display:none}
#ctl details{border:1px solid #33425a;border-radius:6px;margin-bottom:8px;background:#222d3f}
#ctl summary{padding:8px 10px;font-weight:700;cursor:pointer}
#ctl .b{padding:4px 10px 10px;display:grid;gap:6px}
#ctl label{display:grid;gap:2px;font-size:12px;color:#9fb0c6}
#ctl input,#ctl textarea{width:100%;padding:5px 6px;background:#0f1622;color:#fff;border:1px solid #33425a;border-radius:4px;font:inherit}
#ctl input[type=color]{height:30px;padding:1px}#ctl textarea{height:150px}
#ctl .row{display:flex;gap:6px;flex-wrap:wrap}
#ctl button{flex:1;padding:8px 6px;background:#2f5d9e;color:#fff;border:0;border-radius:4px;font-weight:700;cursor:pointer;min-width:60px}
#ctl button.act{background:#d9962b;color:#111}#ctl button.g{background:#3d4b63}
#ctl .big{font-size:22px;text-align:center;padding:4px;font-variant-numeric:tabular-nums}
</style></head>

let S;try{S=merge(D,JSON.parse(localStorage[KEY]))}catch(e){S=merge(D,{})}
const $=id=>document.getElementById(id),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=p=>p.split('.').reduce((o,k)=>o[k],S);
const set=(p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((o,x)=>o[x],S)[l]=v};
function save(){try{localStorage[KEY]=JSON.stringify(S)}catch(e){alert('No se pudo guardar (logos muy pesados).')}bc.postMessage(S);render();syncCtl()}
if(!S.champLogo)S.champLogo=LOGO;
const CONTROL=location.search.includes('control');
if(CONTROL)document.body.classList.add('control');
bc.onmessage=e=>{S=e.data;render();syncCtl()};
addEventListener('storage',e=>{if(e.key==KEY&&e.newValue){S=JSON.parse(e.newValue);render();syncCtl()}});

/* ---------- Overlay ---------- */
const setH=(id,h)=>{const e=$(id);if(e._h!==h){e._h=h;e.innerHTML=h}};
const rgb=h=>{h=String(h).replace('#','');if(h.length==3)h=h.replace(/./g,'$&$&');return [0,2,4].map(i=>parseInt(h.substr(i,2),16)).join(',')};
const logo=u=>u?`<img src="${u}">`:'<div class="ph"></div>';
const plate=u=>`<div class="pl">${logo(u)}</div>`;
const parse=t=>(t||'').split('\n').map(l=>l.trim()).filter(Boolean).map((l,i)=>{const m=l.match(/^(\d{1,2})[\s.\-–)]*(.+)$/);return `<li style="--i:${i}"><b>${m?m[1]:''}</b><span>${esc(m?m[2]:l)}</span></li>`}).join('');
function render(){
 if(CONTROL)return;
 const s=S;
 {const r=document.documentElement.style,t=s.theme;['bg','bg2','acc','acct','txt'].forEach(k=>{r.setProperty('--'+k,t[k]);r.setProperty('--'+k+'-rgb',rgb(t[k]))})}
 setH('intro',`<div class="card"><header>${s.champLogo?`<img src="${s.champLogo}">`:''}<div><p>${esc(s.assoc)}</p><h1>${esc(s.champ)}</h1></div></header>
 <div class="vs"><div class="tm" style="--c:${s.h.color}">${plate(s.h.logo)}<b>${esc(s.h.name)}</b></div><div class="x"><i></i><span>VS</span><i></i></div><div class="tm" style="--c:${s.a.color}">${plate(s.a.logo)}<b>${esc(s.a.name)}</b></div></div>
 <div class="meta">${s.phase?`<span>${esc(s.phase)}</span>`:''}${s.date?`<span>${esc(s.date)}</span>`:''}</div></div>`);
 const n=Math.max((s.h.lineup||'').split('\n').filter(Boolean).length,(s.a.lineup||'').split('\n').filter(Boolean).length);
 const col=t=>`<div class="col${n>13?' sm':''}" style="--c:${t.color}"><h2>${plate(t.logo)}<span>${esc(t.name)}</span></h2><ul>${parse(t.lineup)}</ul></div>`;
 setH('lineup',`<div class="tw"><div class="ttl"><span>${esc(s.champ)}</span>${s.phase?`<i></i><span>${esc(s.phase)}</span>`:''}</div></div><div class="cols">${col(s.h)}${col(s.a)}</div>`);
 const T=(t,r)=>`<div class="t" style="--c:${t.color}">${r?'':plate(t.logo)}<span>${esc(t.abbr)}</span>${r?plate(t.logo):''}</div>`;
 setH('match',`<div class="bug">${s.champLogo?`<div class="cl"><img src="${s.champLogo}"></div>`:''}${T(s.h)}<div class="sw"><span>${s.sh}</span><i></i><span>${s.sa}</span></div>${T(s.a,1)}<div class="clk"><em>${esc(s.clock.label)}</em><span id="clk">00:00</span></div></div>`);
 $('veil').classList.toggle('on',s.screen=='intro'||s.screen=='lineup');
 ['intro','lineup','match'].forEach(k=>$(k).classList.toggle('on',s.screen==k));
 const tk=s.ticker.label+'|'+s.ticker.text;if(tk!==window._tk){window._tk=tk;$('ticker').innerHTML=`<i>${esc(s.ticker.label)}</i><span><div class="mq" style="--d:${Math.max(12,Math.round(s.ticker.text.length*.2+10))}s">${esc(s.ticker.text)}</div></span>`}
 $('ticker').classList.toggle('on',s.ticker.on&&!!s.ticker.text&&!s.spons.on);
 const sp=s.spons;$('ticker').classList.toggle('up',sp.on);
 $('aus').className=(sp.on?'on ':'')+({left:'l',right:'r'}[sp.pos]||'c');
 const sk=[sp.on,sp.imgs.map(u=>u.length).join(),sp.secs,sp.text].join('|');
 if(sk!==window._sk){window._sk=sk;clearInterval(window._st);window._si=0;
  if(!sp.imgs.length)$('aus').textContent=sp.text;
  else{$('aus').innerHTML=`<img src="${sp.imgs[0]}">`;
   if(sp.imgs.length>1)window._st=setInterval(()=>{const im=$('aus').querySelector('img'),n=S.spons.imgs.length;if(!im||n<2)return;im.classList.add('sw');setTimeout(()=>{window._si=(window._si+1)%n;im.src=S.spons.imgs[window._si];im.classList.remove('sw')},350)},Math.max(2,+sp.secs||6)*1000)}}
 tick();
}
const secs=()=>S.clock.base+(S.clock.start?(Date.now()-S.clock.start)/1000:0);
const fmt=t=>{t=Math.max(0,Math.floor(t));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
function tick(){const e=$('clk');if(e)e.textContent=fmt(secs());const c=$('cclk');if(c)c.textContent=fmt(secs())}
setInterval(tick,250);
function fit(){$('stage').style.transform=`scale(${innerWidth/1920})`}
addEventListener('resize',fit);fit();

/* ---------- Panel de control (abrir con ?control) ---------- */

 <label>Nombre<input data-k="${k}.name"></label><label>Iniciales<input data-k="${k}.abbr" maxlength="4"></label>
 <label>Color<input type="color" data-k="${k}.color"></label><label>Logo<input type="file" accept="image/*" data-logo="${k}.logo"></label>
 <label>Alineación (una línea por jugador: "1 Nombre")<textarea data-k="${k}.lineup"></textarea></label></div></details>`}
function buildCtl(){

 <details open><summary>Pantalla</summary><div class="b"><div class="row">

  <label>Texto<input type="color" data-k="theme.txt"></label></div></details>

 ${teamBox('h','Equipo local')}${teamBox('a','Equipo visitante')}

  <div class="big" id="cclk">00:00</div>

  <label>Etiqueta de tiempo<input data-k="clock.label"></label></div></details>

 <details open><summary id="sA">Banner de auspiciadores (parte inferior)</summary><div class="b">
  <label>Agregar imágenes (puedes elegir varias a la vez)<input type="file" accept="image/*" multiple data-add="1"></label>
  <div class="row" id="slist"></div>
  <label>Segundos por auspiciador<input type="number" min="2" max="60" data-k="spons.secs"></label>
  <div class="row"><button class="g" data-p="left">Izquierda</button><button class="g" data-p="center">Centro</button><button class="g" data-p="right">Derecha</button></div>
  <label>Texto si no hay imágenes<input data-k="spons.text"></label>
  <div class="row"><button id="ta1">Mostrar banner</button><button class="g" id="ta0">Ocultar banner</button></div></div></details>`;
 $('ctl').addEventListener('input',e=>{const k=e.target.dataset.k;if(k){set(k,e.target.value);if(k=='theme.preset'&&PRE[e.target.value])Object.assign(S.theme,PRE[e.target.value]);save()}});
 $('ctl').addEventListener('change',e=>{const t=e.target;
  if(t.dataset.add){Promise.all([...t.files].map(f=>shrink(f,1700,true))).then(us=>{S.spons.imgs.push(...us);t.value='';save()});return}
  const p=t.dataset.logo;if(p&&t.files[0])shrink(t.files[0],320).then(u=>{set(p,u);save()})});
 const arm=(el,label,fn)=>{if(el._a){clearTimeout(el._t);el._a=0;el.textContent=label;fn();save()}else{el._a=1;el.textContent='¿Seguro? Clic otra vez';el._t=setTimeout(()=>{el._a=0;el.textContent=label},3000)}};
 $('ctl').addEventListener('click',e=>{const id=e.target.id,d=e.target.dataset;if(!d)return;
  const M={tt1:()=>S.ticker.on=true,tt0:()=>S.ticker.on=false,ta1:()=>S.spons.on=true,ta0:()=>S.spons.on=false};
  if(M[id]){M[id]();save();return}
  if(id=='rt'){arm(e.target,'Reiniciar tiempo',()=>{S.clock.base=0;S.clock.start=null});return}
  if(id=='rp'){arm(e.target,'Reiniciar partido',()=>{S.sh=0;S.sa=0;S.clock.base=0;S.clock.start=null;S.clock.label='1T'});return}
  if(d.s){S.screen=d.s}
  else if(d.g){const[k,v]=d.g.split(',');S[k]=Math.max(0,S[k]+ +v)}
  else if(d.l){S.clock.label=d.l}
  else if(d.p){S.spons.pos=d.p}
  else if(d.rm!==undefined){S.spons.imgs.splice(+d.rm,1)}
  else if(d.c){const c=S.clock,now=Date.now();
   if(d.c=='start'&&!c.start)c.start=now;
   if(d.c=='pause'&&c.start){c.base+=(now-c.start)/1000;c.start=null}
   if(d.c=='m1'||d.c=='m-1')c.base=Math.max(0,c.base+(d.c=='m1'?60:-60));
   if(d.c=='set'){const m=$('tset').value.match(/^(\d+):?(\d{0,2})$/);if(m){c.base=+m[1]*60+(+m[2]||0);if(c.start)c.start=now}}}
  else return;save()});
 setInterval(tick,250);
}
function syncCtl(){if(!CONTROL)return;
 document.querySelectorAll('[data-k]').forEach(i=>{if(document.activeElement!==i)i.value=get(i.dataset.k)});
 document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('act',S.screen==b.dataset.s));
 document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('act',S.clock.label==b.dataset.l));
 $('tt1').classList.toggle('act',S.ticker.on);
 $('sT').textContent='Cintillo — '+(S.ticker.on?(!S.ticker.text?'activado, pero falta escribir el mensaje':S.spons.on?'activado (oculto mientras el banner está visible)':'VISIBLE'):'oculto');
 $('sA').textContent='Banner de auspiciadores — '+(S.spons.on?'VISIBLE':'oculto');$('ta1').classList.toggle('act',S.spons.on);
 document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('act',S.spons.pos==b.dataset.p));
 const h=S.spons.imgs.map((u,i)=>`<div style="position:relative"><img src="${u}" style="height:44px;background:#fff;display:block"><button data-rm="${i}" style="position:absolute;top:0;right:0;flex:none;min-width:0;padding:0 6px">×</button></div>`).join('')||'<span style="color:#9fb0c6">Sin imágenes aún</span>';
 if($('slist').dataset.h!==h){$('slist').dataset.h=h;$('slist').innerHTML=h}}
function shrink(f,max,jpg){return new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;const x=c.getContext('2d');if(jpg){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(i,0,0,c.width,c.height);r(jpg?c.toDataURL('image/jpeg',.88):c.toDataURL('image/png'))};i.src=u})}
if(CONTROL){buildCtl();syncCtl();$('pvf').src=location.href.split('?')[0].split('#')[0];const fp=()=>{const w=$('pv').clientWidth;if(w)$('pvf').style.transform=`scale(${w/1920})`};addEventListener('resize',fp);fp();if(window.ResizeObserver)new ResizeObserver(fp).observe($('pv'))}else{render();window._ls=localStorage[KEY];setInterval(()=>{try{const v=localStorage[KEY];if(v&&v!==window._ls){window._ls=v;S=merge(D,JSON.parse(v));if(!S.champLogo)S.champLogo=LOGO;render()}}catch(e){}},500)}
</script></body></html>
